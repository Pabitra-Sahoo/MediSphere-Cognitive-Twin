# ============================================================
# MediSphere Cognitive Twin — Base Application Configuration
# ============================================================
# Shared settings across all profiles.
# Profile-specific overrides in application-{profile}.yml

spring:
  application:
    name: medisphere-backend

  # MongoDB defaults (overridden per profile)
  data:
    mongodb:
      database: ${MONGO_DATABASE:medisphere}
      auto-index-creation: true

  # Kafka defaults (overridden per profile)
  kafka:
    admin:
      fail-fast: false
    consumer:
      group-id: medisphere-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${SERVER_PORT:8080}

# JWT Configuration (stateless authentication)
jwt:
  # Secret key for HMAC-SHA256 (overridable via JWT_SECRET env var)
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  # Token expiration time in milliseconds (default 24 hours)
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Logging
logging:
  level:
    com.medisphere: INFO
    org.springframework.web: INFO
    org.springframework.data.mongodb: WARN
    org.apache.kafka: WARN

