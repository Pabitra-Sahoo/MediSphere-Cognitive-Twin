# ============================================================
# MediSphere — Development Profile (local machine)
# ============================================================
# MongoDB and Kafka on localhost (Docker Compose ports exposed)

spring:
  data:
    mongodb:
      uri: mongodb://localhost:${MONGO_PORT:27017}/${MONGO_DATABASE:medisphere}

  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9092}

logging:
  level:
    com.medisphere: DEBUG
