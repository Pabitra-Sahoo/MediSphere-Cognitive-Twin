# ============================================================
# MediSphere — Docker Profile (inside Docker Compose network)
# ============================================================
# Services referenced by container name instead of localhost

spring:
  data:
    mongodb:
      uri: mongodb://${MONGO_INITDB_ROOT_USERNAME:medisphere}:${MONGO_INITDB_ROOT_PASSWORD:changeme}@mongodb:27017/${MONGO_DATABASE:medisphere}?authSource=admin

  kafka:
    bootstrap-servers: kafka:29092
    admin:
      auto-create: true

logging:
  level:
    com.medisphere: INFO

ml-service:
  base-url: ${ML_SERVICE_URL:http://ml-service:8000}
  timeout-ms: ${ML_SERVICE_TIMEOUT_MS:5000}
  internal-key: ${ML_SERVICE_INTERNAL_KEY:medisphere-dev-internal-key-change-in-prod}
